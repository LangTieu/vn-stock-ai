name: Snapshot Finhay current universe and sectors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2a-finhay-universe.yml'
      - 'scripts/fetch_p2a_finhay_universe.py'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch current stock catalog and all sector constituent pages
        env:
          FINHAY_API_KEY: ${{ secrets.FINHAY_API_KEY }}
        run: python3 scripts/fetch_p2a_finhay_universe.py --output data/p2a-label-v2
      - name: Upload sanitized current-snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-finhay-current-universe
          path: data/p2a-label-v2/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

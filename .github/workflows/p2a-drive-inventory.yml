name: Inspect P2 source files in Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/p2-async-evaluation
      - name: Configure read-only Colab OAuth token
        env:
          VNCOLAB_TOKEN: ${{ secrets.VNCOLAB_TOKEN }}
        run: |
          umask 077
          mkdir -p "$HOME/.config/vncolab"
          printf '%s' "$VNCOLAB_TOKEN" > "$HOME/.config/vncolab/token.json"
          chmod 600 "$HOME/.config/vncolab/token.json"
      - name: Inventory and inspect requested Drive JSONs without exporting source data
        run: |
          python3 -m pip install --quiet "google-auth>=2.49.1" "requests>=2.32.5"
          python3 scripts/p2a_drive_inventory.py \
            --token-file "$HOME/.config/vncolab/token.json" \
            --output /tmp/p2a-drive-inventory/report.json
      - name: Upload structural report only (no source rows or prices)
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-inventory
          path: /tmp/p2a-drive-inventory/report.json
          if-no-files-found: error
          retention-days: 3

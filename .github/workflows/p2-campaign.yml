name: P2 train/evaluate operator and campaign planner

on:
  workflow_run:
    workflows: [Run Colab notebook]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [p2-campaign-run-completed]
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose training (approval-gated) or isolated checkpoint evaluation"
        type: choice
        options: [train, evaluate]
        required: true
        default: train
      checkpoint_step:
        description: "Checkpoint step for evaluation"
        required: false
        default: latest
      dry_run:
        description: "Rehearse the plan only; no workflow dispatch"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  actions: write

jobs:
  event-plan:
    if: ${{ github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch' || inputs.dry_run }}
    runs-on: ubuntu-latest
    concurrency:
      group: p2-campaign-ledger-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download non-secret source run context artifact
        if: ${{ github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: p2-campaign-run-context
          path: /tmp/p2-campaign-source-context
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.client_payload.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build redacted event or operator plan without credentials or dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          CHECKPOINT_STEP: ${{ inputs.checkpoint_step }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.client_payload.run_id }}
          WORKFLOW_RUN_STATUS: ${{ github.event.workflow_run.status }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_planner() {
            set +e
            "$@"
            result=$?
            set -e
            if [ -s p2-campaign-plan.json ] && jq -e '.decision' p2-campaign-plan.json >/dev/null; then
              return 0
            fi
            return "$result"
          }
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            python3 - <<'PY' > /tmp/p2-campaign-event.json
          import json, os
          print(json.dumps({
              'run_id': os.environ['WORKFLOW_RUN_ID'],
              'status': os.environ['WORKFLOW_RUN_STATUS'],
              'conclusion': os.environ['WORKFLOW_RUN_CONCLUSION'],
              'head_branch': os.environ['WORKFLOW_RUN_BRANCH'],
              'head_sha': os.environ['WORKFLOW_RUN_SHA'],
          }))
          PY
            elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
              [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source run id in campaign event" >&2; exit 2; }
              gh run view "$WORKFLOW_RUN_ID" --json databaseId,status,conclusion,headBranch,headSha \
                | jq '{run_id: .databaseId, status: .status, conclusion: .conclusion,
                      head_branch: .headBranch, head_sha: .headSha}' > /tmp/p2-campaign-event.json
            fi
          if [ "$EVENT_NAME" = "workflow_run" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            run_planner python3 scripts/p2_campaign.py event --manifest docs/p2-campaign.json \
              --event /tmp/p2-campaign-event.json --output p2-campaign-plan.json
            record_result=$(python3 scripts/p2_campaign_ledger.py record \
              --ledger docs/p2-campaign-ledger-v2.json \
              --event /tmp/p2-campaign-event.json \
              --decision "$(jq -r '.decision' p2-campaign-plan.json)")
            echo "LEDGER_RECORD_RESULT=$record_result"
            if jq -e '.recorded == true' <<<"$record_result" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add docs/p2-campaign-ledger-v2.json
              git commit -m "Record P2 campaign source run ${WORKFLOW_RUN_ID}"
              git push origin HEAD:main
            fi
            if [ -f /tmp/p2-campaign-source-context/p2-campaign-run-context.json ]; then
              context_file=/tmp/p2-campaign-source-context/p2-campaign-run-context.json
              if jq -e --arg approval "$(jq -r '.training_approval.approval_reference // ""' docs/p2-campaign.json)" \
                  '.campaign_id == "p2a-v2-full" and .notebook == "notebooks/p2a_train.ipynb" and .mode == "full" and .training_approval_ref == $approval and .p2a_v2_dataset_revision == "4e00aefe775509fdd69fe1e70c6232468d4041d8"' \
                  "$context_file" >/dev/null && [ "$WORKFLOW_RUN_CONCLUSION" = success ]; then
                python3 -m pip install --quiet "huggingface_hub==0.30.2"
              fi
              python3 scripts/p2_campaign_chain.py plan \
                --ledger docs/p2-campaign-ledger-v2.json \
                --event /tmp/p2-campaign-event.json \
                --context "$context_file" \
                --output p2-campaign-chain-plan.json
              if jq -e '.ledger_changed == true' p2-campaign-chain-plan.json >/dev/null; then
                git add docs/p2-campaign-ledger-v2.json
                git commit -m "Record P2 campaign continuation intent from run ${WORKFLOW_RUN_ID}"
                git push origin HEAD:main
              fi
              if jq -e '.dispatch == true' p2-campaign-chain-plan.json >/dev/null; then
                export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
                intent_id=$(jq -r '.intent_id' p2-campaign-chain-plan.json)
                python3 scripts/p2_campaign_chain.py mark-dispatching \
                  --ledger docs/p2-campaign-ledger-v2.json --intent-id "$intent_id"
                git add docs/p2-campaign-ledger-v2.json
                git commit -m "Authorize P2 campaign dispatch intent ${WORKFLOW_RUN_ID}"
                git push origin HEAD:main
                python3 scripts/p2_campaign_chain.py dispatch \
                  --ledger docs/p2-campaign-ledger-v2.json \
                  --plan-file p2-campaign-chain-plan.json
                python3 scripts/p2_campaign_chain.py mark-submitted \
                  --ledger docs/p2-campaign-ledger-v2.json --intent-id "$intent_id"
                git add docs/p2-campaign-ledger-v2.json
                git commit -m "Mark P2 campaign continuation submitted from run ${WORKFLOW_RUN_ID}"
                git push origin HEAD:main
              fi
            fi
          else
            run_planner python3 scripts/p2_operator.py "$OPERATION" \
              --manifest docs/p2-campaign.json --checkpoint-step "${CHECKPOINT_STEP:-latest}" \
              > p2-campaign-plan.json
            cat p2-campaign-plan.json
          fi
      - name: Upload dry-run decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-campaign-plan
          path: |
            p2-campaign-plan.json
            p2-campaign-chain-plan.json
            docs/p2-campaign-ledger-v2.json
          if-no-files-found: ignore
          retention-days: 14

  operator-evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'evaluate' && !inputs.dry_run }}
    runs-on: [self-hosted, colab-driver-lv1]
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch isolated evaluation through the shared operator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/p2_operator.py evaluate --dispatch \
            --manifest docs/p2-campaign.json --checkpoint-step "${{ inputs.checkpoint_step }}"

  operator-training:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'train' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed until campaign approval and V2 full-training path are ready
        run: |
          python3 scripts/p2_operator.py train --dispatch --manifest docs/p2-campaign.json

name: Run Colab notebook

# GitHub dieu khien Colab qua API (khong can trinh duyet, khong can dang
# nhap Google tren may): bam "Run workflow" (hoac goi API dispatch) ->
# self-hosted runner tren InstaBox chay scripts/vncolab.py, cap T4 free
# qua API Colab, chay notebook, gom output ve artifact.
# Token TK1 cat san tren may chay (~/.config/vncolab/token.json, 0600).
# Duong cu (colabctl/CDP) da park: can dang nhap Google tren desktop
# InstaBox, anh khong lam duoc bang dien thoai.
on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "Notebook trong repo (duong dan, vd notebooks/p0_qwen15b_vcb_real.ipynb)"
        required: true
        default: "notebooks/p0_qwen15b_vcb_real.ipynb"
      mode:
        description: "Notebook execution mode"
        type: choice
        options: [smoke, full]
        required: true
        default: "full"
      gpu:
        description: "GPU Colab (T4 free; L4/A100 can units)"
        required: false
        default: "T4"
      timeout:
        description: "Cho toi da bao nhieu giay"
        required: false
        default: "1800"
      max_steps:
        description: "Training steps for this session"
        required: true
        default: "100"
      resume_checkpoint:
        description: "Full checkpoint directory to resume from"
        required: false
        default: ""
      save_steps:
        description: "Checkpoint interval for this session"
        required: true
        default: "100"
      download_remote:
        description: "Runtime directory or file to download as a zip"
        required: false
        default: ""
      download_local:
        description: "Runner path for the downloaded zip"
        required: false
        default: ""
      runner:
        description: "Nhan runner: colab-driver (may 1, TK1) hoac colab-driver-tk2 (may 2, TK2)"
        required: false
        default: "colab-driver"

jobs:
  run-colab:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    steps:
      - uses: actions/checkout@v4
      - name: Run notebook on Colab T4 (vncolab)
        env:
          # MODE is explicitly bridged into the Colab kernel by vncolab.
          MODE: ${{ inputs.mode }}
          MAX_STEPS: ${{ inputs.max_steps }}
          RESUME_CHECKPOINT: ${{ inputs.resume_checkpoint }}
          SAVE_STEPS: ${{ inputs.save_steps }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_CHECKPOINT_REPO: Jerlob/vn-stock-ai-p2a-checkpoints
          DOWNLOAD_REMOTE: ${{ inputs.download_remote }}
          DOWNLOAD_LOCAL: ${{ inputs.download_local }}
        run: |
          # Dung venv cai san tren may (deps: google-auth, jupyter-kernel-client...).
          # Neu may moi/chua co venv thi tao moi + cai deps (fallback tu phuc hoi).
          if [ -x "$HOME/vncolab-venv/bin/python" ]; then
            PY="$HOME/vncolab-venv/bin/python"
          else
            python3 -m venv .vncolab-venv
            .vncolab-venv/bin/pip install -q "google-auth>=2.49.1" "google-auth-oauthlib>=1.3.0" "requests>=2.32.5" "jupyter-kernel-client==0.9.0" "nbformat>=5.10.4" "websocket-client>=1.6"
            PY=".vncolab-venv/bin/python"
          fi
          download_args=()
          if [ -n "$DOWNLOAD_REMOTE" ] && [ -n "$DOWNLOAD_LOCAL" ]; then
            download_args=(--download "$DOWNLOAD_REMOTE" "$DOWNLOAD_LOCAL")
          fi
          # --mode: env cua runner KHONG tu sang kernel Colab (vncolab chi gui
          # source code qua execute_code), nen phai truyen tuong minh; vncolab
          # se set os.environ["MODE"] tren kernel truoc cell dau tien.
          "$PY" scripts/vncolab.py run "${{ inputs.notebook }}" --gpu "${{ inputs.gpu }}" --timeout "${{ inputs.timeout }}" --mode "$MODE" --max-steps "$MAX_STEPS" --resume-checkpoint "$RESUME_CHECKPOINT" --save-steps "$SAVE_STEPS" --out colab_result.json "${download_args[@]}"
      - name: Show result
        if: always()
        run: |
          echo "--- COLAB RESULT ---"
          cat colab_result.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-result
          path: colab_result.json
      - name: Check downloaded adapter
        id: adapter
        if: always() && inputs.download_remote != '' && inputs.download_local != ''
        env:
          DOWNLOAD_LOCAL: ${{ inputs.download_local }}
        run: |
          if [ -f "$DOWNLOAD_LOCAL" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: colab-adapter
        if: always() && inputs.download_remote != '' && inputs.download_local != '' && steps.adapter.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: colab-adapter
          path: ${{ inputs.download_local }}
          if-no-files-found: ignore

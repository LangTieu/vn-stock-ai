name: Run Colab notebook

# GitHub dieu khien Colab qua API (khong can trinh duyet, khong can dang
# nhap Google tren may): bam "Run workflow" (hoac goi API dispatch) ->
# GitHub-hosted runner chay scripts/vncolab.py, cap T4 free
# qua API Colab, chay notebook, gom output ve artifact.
# VNCOLAB_TOKEN secret is written to ~/.config/vncolab/token.json (0600).
# Duong cu (colabctl/CDP) da park: can dang nhap Google tren desktop
# InstaBox, anh khong lam duoc bang dien thoai.
on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "Notebook trong repo (duong dan, vd notebooks/p0_qwen15b_vcb_real.ipynb)"
        required: true
        default: "notebooks/p0_qwen15b_vcb_real.ipynb"
      mode:
        description: "Notebook execution mode"
        type: choice
        options: [smoke, full]
        required: true
        default: "full"
      training_approval_ref:
        description: "Required for full mode: explicit Henrry approval reference verified by Liaison"
        required: false
        default: ""
      gpu:
        description: "GPU Colab (T4 free; L4/A100 can units)"
        required: false
        default: "T4"
      timeout:
        description: "Cho toi da bao nhieu giay"
        required: false
        default: "1800"
      max_steps:
        description: "Training steps for this session"
        required: true
        default: "50"
      resume_checkpoint:
        description: "Full checkpoint directory to resume from"
        required: false
        default: ""
      p2a_v2_dataset_revision:
        description: "Immutable 40-character revision of the private V2 train/validation dataset; required for notebooks/p2a_train.ipynb"
        required: false
        default: ""
      campaign_id:
        description: "P2 campaign identifier used for audited checkpoint continuation"
        required: false
        default: "p2a-v2-full"
      campaign_chain_source_run_id:
        description: "Coordinator source run that created this continuation"
        required: false
        default: ""
      save_steps:
        description: "Checkpoint interval for this session"
        required: true
        default: "25"
      download_remote:
        description: "Runtime directory or file to download as a zip"
        required: false
        default: ""
      download_local:
        description: "Runner path for the downloaded zip"
        required: false
        default: ""
      runner:
        description: "Nhan runner: colab-driver (may 1, TK1) hoac colab-driver-tk2 (may 2, TK2)"
        required: false
        default: "colab-driver"
      executor:
        description: "Executor for this dispatch"
        type: choice
        options: [github, machine1, lv1]
        required: true
        default: github
      train_profile:
        description: "Liaison-installed named training credential profile (used only with executor=lv1)"
        type: choice
        options: [train_tk4, train_tk5, train_tk1, train_tk6]
        required: true
        default: train_tk4
      drive_inventory:
        description: "Only inspect P2 source JSONs in Drive; do not start Colab or training"
        type: boolean
        required: true
        default: false
      drive_quota_project:
        description: "Optional Google Cloud quota project ID where the Drive OAuth user has Service Usage Consumer"
        required: false
        default: ""
      hf_source_audit:
        description: "Read authorized HF P2 OHLCV source files and upload only aggregate coverage metadata"
        type: boolean
        required: true
        default: false
      p2a_v2_smoke:
        description: "Run the authorized bounded P2a v2 gradient smoke (never full training)"
        type: boolean
        required: true
        default: false
      p2a_source_run_id:
        description: "Completed Finfo v2-label Actions run containing the private label artifact"
        required: false
        default: ""
      p2a_smoke_max_steps:
        description: "Smoke only; max 50 steps (default 2)"
        type: number
        required: true
        default: 2
      p2a_v2_ablation:
        description: "Run three controlled, short v2 LoRA/LR trials only"
        type: boolean
        required: true
        default: false
      p2a_ablation_source_run_id:
        description: "Successful private Finfo v2-label Actions run"
        required: false
        default: ""
      p2a_ablation_steps:
        description: "Optimizer steps per trial (max 50; default 12)"
        type: number
        required: true
        default: 12
permissions:
  contents: read
  actions: read

concurrency:
  group: p2-colab-tk2-tk5
  cancel-in-progress: false

jobs:
  drive-inventory:
    if: ${{ inputs.drive_inventory }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure read-only Colab OAuth token
        env:
          VNCOLAB_TOKEN: ${{ secrets.VNCOLAB_TOKEN }}
        run: |
          umask 077
          mkdir -p "$HOME/.config/vncolab"
          printf '%s' "$VNCOLAB_TOKEN" > "$HOME/.config/vncolab/token.json"
          chmod 600 "$HOME/.config/vncolab/token.json"
      - name: Inventory Drive JSONs without exporting source rows or prices
        env:
          P2A_DRIVE_QUOTA_PROJECT: ${{ inputs.drive_quota_project }}
        run: |
          python3 -m pip install --quiet "google-auth>=2.49.1" "requests>=2.32.5"
          args=()
          if [ -n "$P2A_DRIVE_QUOTA_PROJECT" ]; then
            args+=(--quota-project "$P2A_DRIVE_QUOTA_PROJECT")
          fi
          python3 scripts/p2a_drive_inventory.py "${args[@]}" \
            --token-file "$HOME/.config/vncolab/token.json" \
            --output /tmp/p2a-drive-inventory/report.json
      - name: Upload schema/date/count/hash report only
        uses: actions/upload-artifact@v4
        with:
          name: p2a-drive-inventory
          path: /tmp/p2a-drive-inventory/report.json
          if-no-files-found: error
          retention-days: 3

  hf-source-audit:
    if: ${{ inputs.hf_source_audit }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download only matching P1 ticker bars and exchange index bars for a private audit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --quiet "huggingface_hub==0.30.2" "pyarrow==22.0.0"
          python3 scripts/p2a_hf_ohlcv_audit.py \
            --p1-work /tmp/p2a-hf-p1 \
            --output /tmp/p2a-hf-ohlcv-audit/report.json
      - name: Upload aggregate audit only (no prices, samples, or labels)
        uses: actions/upload-artifact@v4
        with:
          name: p2a-hf-ohlcv-audit
          path: /tmp/p2a-hf-ohlcv-audit/report.json
          if-no-files-found: error
          retention-days: 3

  run-colab:
    if: ${{ !inputs.drive_inventory && !inputs.hf_source_audit && !inputs.p2a_v2_smoke && !inputs.p2a_v2_ablation }}
    permissions:
      contents: write
      actions: read
    runs-on: ${{ inputs.executor == 'machine1' && fromJSON('["self-hosted", "colab-driver"]') || inputs.executor == 'lv1' && fromJSON('["self-hosted", "colab-driver-lv1"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Write non-secret campaign run context
        if: always()
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          NOTEBOOK_INPUT: ${{ inputs.notebook }}
          MODE_INPUT: ${{ inputs.mode }}
          APPROVAL_REF_INPUT: ${{ inputs.training_approval_ref }}
          DATASET_REVISION_INPUT: ${{ inputs.p2a_v2_dataset_revision }}
          CHAIN_SOURCE_RUN_ID: ${{ inputs.campaign_chain_source_run_id }}
          MAX_STEPS_INPUT: ${{ inputs.max_steps }}
          SAVE_STEPS_INPUT: ${{ inputs.save_steps }}
          RESUME_CHECKPOINT_INPUT: ${{ inputs.resume_checkpoint }}
          EXECUTOR_INPUT: ${{ inputs.executor }}
          TRAIN_PROFILE_INPUT: ${{ inputs.train_profile }}
          GPU_INPUT: ${{ inputs.gpu }}
          TIMEOUT_INPUT: ${{ inputs.timeout }}
          DRIVE_INVENTORY_INPUT: ${{ inputs.drive_inventory }}
          HF_SOURCE_AUDIT_INPUT: ${{ inputs.hf_source_audit }}
          V2_SMOKE_INPUT: ${{ inputs.p2a_v2_smoke }}
          V2_ABLATION_INPUT: ${{ inputs.p2a_v2_ablation }}
        run: |
          python3 - <<'PY'
          import json, os
          context = {
              'campaign_id': os.environ.get('CAMPAIGN_ID', ''),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
              'workflow_ref': 'main' if os.environ.get('GITHUB_REF', '').endswith('/main') else os.environ.get('GITHUB_REF', ''),
              'notebook': os.environ.get('NOTEBOOK_INPUT', ''),
              'mode': os.environ.get('MODE_INPUT', ''),
              'training_approval_ref': os.environ.get('APPROVAL_REF_INPUT', ''),
              'p2a_v2_dataset_revision': os.environ.get('DATASET_REVISION_INPUT', ''),
              'campaign_chain_source_run_id': os.environ.get('CHAIN_SOURCE_RUN_ID', ''),
              'max_steps': os.environ.get('MAX_STEPS_INPUT', ''),
              'save_steps': os.environ.get('SAVE_STEPS_INPUT', ''),
              'resume_checkpoint': os.environ.get('RESUME_CHECKPOINT_INPUT', ''),
              'executor': os.environ.get('EXECUTOR_INPUT', ''),
              'train_profile': os.environ.get('TRAIN_PROFILE_INPUT', ''),
              'gpu': os.environ.get('GPU_INPUT', ''),
              'timeout': os.environ.get('TIMEOUT_INPUT', ''),
              'drive_inventory': os.environ.get('DRIVE_INVENTORY_INPUT', ''),
              'hf_source_audit': os.environ.get('HF_SOURCE_AUDIT_INPUT', ''),
              'p2a_v2_smoke': os.environ.get('V2_SMOKE_INPUT', ''),
              'p2a_v2_ablation': os.environ.get('V2_ABLATION_INPUT', ''),
          }
          with open('p2-campaign-run-context.json', 'w', encoding='utf-8') as out:
              json.dump(context, out, sort_keys=True)
              out.write('\n')
          PY
      - name: Require explicit training approval for full mode
        if: ${{ inputs.mode == 'full' && !inputs.p2a_v2_smoke && !inputs.p2a_v2_ablation && !inputs.drive_inventory && !inputs.hf_source_audit }}
        env:
          APPROVAL_REF_INPUT: ${{ inputs.training_approval_ref }}
          APPROVAL_REF_CONFIGURED: ${{ secrets.P2_TRAIN_APPROVAL_REF }}
        run: |
          set -euo pipefail
          if [ -z "$APPROVAL_REF_INPUT" ] || [ -z "$APPROVAL_REF_CONFIGURED" ] || [ "$APPROVAL_REF_INPUT" != "$APPROVAL_REF_CONFIGURED" ]; then
            echo "Full training is blocked: explicit matching Henrry approval reference is required." >&2
            exit 2
          fi
      - name: Validate bounded P2a campaign session and continuation intent
        if: ${{ inputs.notebook == 'notebooks/p2a_train.ipynb' && inputs.mode == 'full' }}
        env:
          CAMPAIGN_ID_INPUT: ${{ inputs.campaign_id }}
          APPROVAL_REF_INPUT: ${{ inputs.training_approval_ref }}
          DATASET_REVISION_INPUT: ${{ inputs.p2a_v2_dataset_revision }}
          MAX_STEPS_INPUT: ${{ inputs.max_steps }}
          SAVE_STEPS_INPUT: ${{ inputs.save_steps }}
          RESUME_CHECKPOINT_INPUT: ${{ inputs.resume_checkpoint }}
          CHAIN_SOURCE_RUN_ID: ${{ inputs.campaign_chain_source_run_id }}
          NOTEBOOK_INPUT: ${{ inputs.notebook }}
          MODE_INPUT: ${{ inputs.mode }}
          EXECUTOR_INPUT: ${{ inputs.executor }}
          GPU_INPUT: ${{ inputs.gpu }}
          TRAIN_PROFILE_INPUT: ${{ inputs.train_profile }}
          TIMEOUT_INPUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/p2a-campaign-dispatch-inputs.json
          import json, os
          print(json.dumps({
              'campaign_id': os.environ['CAMPAIGN_ID_INPUT'],
              'notebook': os.environ['NOTEBOOK_INPUT'],
              'mode': os.environ['MODE_INPUT'],
              'executor': os.environ['EXECUTOR_INPUT'],
              'gpu': os.environ['GPU_INPUT'],
              'train_profile': os.environ['TRAIN_PROFILE_INPUT'],
              'save_steps': os.environ['SAVE_STEPS_INPUT'],
              'timeout': os.environ['TIMEOUT_INPUT'],
              'training_approval_ref': os.environ['APPROVAL_REF_INPUT'],
              'p2a_v2_dataset_revision': os.environ['DATASET_REVISION_INPUT'],
              'max_steps': os.environ['MAX_STEPS_INPUT'],
              'resume_checkpoint': os.environ['RESUME_CHECKPOINT_INPUT'],
              'campaign_chain_source_run_id': os.environ['CHAIN_SOURCE_RUN_ID'],
          }))
          PY
          python3 scripts/p2_campaign_ledger.py validate-dispatch \
            --ledger docs/p2-campaign-ledger-v2.json \
            --inputs /tmp/p2a-campaign-dispatch-inputs.json
      - name: Verify pinned private V2 dataset before Colab assignment
        if: ${{ inputs.notebook == 'notebooks/p2a_train.ipynb' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          P2A_V2_DATASET_REVISION_INPUT: ${{ inputs.p2a_v2_dataset_revision }}
        run: |
          set -euo pipefail
          test -n "$P2A_V2_DATASET_REVISION_INPUT" || { echo "P2a requires an immutable V2 dataset revision" >&2; exit 2; }
          if [ ! -x "$HOME/vncolab-venv/bin/python" ]; then
            python3 -m venv "$HOME/vncolab-venv"
          fi
          "$HOME/vncolab-venv/bin/python" -m pip install -q \
            "google-auth>=2.49.1" "google-auth-oauthlib>=1.3.0" "requests>=2.32.5" \
            "jupyter-kernel-client==0.9.0" "nbformat>=5.10.4" "websocket-client>=1.6" \
            "huggingface_hub==0.30.2" "cryptography>=44,<47"
          "$HOME/vncolab-venv/bin/python" scripts/p2a_v2_dataset.py verify \
            --campaign-manifest docs/p2-campaign.json \
            --revision "$P2A_V2_DATASET_REVISION_INPUT"
          dataset_sha=$(jq -r '.dataset.files["train-v2.jsonl"] | if type == "object" then .sha256 else . end' docs/p2-campaign.json)
          validation_sha=$(jq -r '.dataset.files["validation-v2.jsonl"] | if type == "object" then .sha256 else . end' docs/p2-campaign.json)
          train_md5=$(jq -r '.dataset.file_md5["train-v2.jsonl"]' docs/p2-campaign.json)
          validation_md5=$(jq -r '.dataset.file_md5["validation-v2.jsonl"]' docs/p2-campaign.json)
          for value in "$dataset_sha" "$validation_sha" "$train_md5" "$validation_md5"; do
            test -n "$value" && test "$value" != null || { echo "Pinned V2 checksums are incomplete" >&2; exit 2; }
          done
          {
            echo "P2A_LABEL_VERSION=2"
            echo "P2A_V2_DATASET_REPO=Jerlob/vn-stock-ai-p2a-v2"
            echo "P2A_V2_DATASET_REVISION=$P2A_V2_DATASET_REVISION_INPUT"
            echo "TRAIN_URL=hf://Jerlob/vn-stock-ai-p2a-v2@$P2A_V2_DATASET_REVISION_INPUT/train-v2.jsonl"
            echo "HOLDOUT_URL=hf://Jerlob/vn-stock-ai-p2a-v2@$P2A_V2_DATASET_REVISION_INPUT/validation-v2.jsonl"
            echo "TRAIN_MD5=$train_md5"
            echo "HOLDOUT_MD5=$validation_md5"
            echo "P2A_TRAIN_SHA256=$dataset_sha"
            echo "P2A_HOLDOUT_SHA256=$validation_sha"
            echo "SKIP_EVAL=1"
          } >> "$GITHUB_ENV"
      - name: Configure Colab credentials
        if: ${{ inputs.executor == 'github' }}
        env:
          VNCOLAB_TOKEN: ${{ secrets.VNCOLAB_TOKEN }}
        run: |
          umask 077
          mkdir -p "$HOME/.config/vncolab"
          printf '%s' "$VNCOLAB_TOKEN" > "$HOME/.config/vncolab/token.json"
          chmod 600 "$HOME/.config/vncolab/token.json"
      - name: Run notebook on Colab T4 (vncolab)
        env:
          # MODE is explicitly bridged into the Colab kernel by vncolab.
          MODE: ${{ inputs.mode }}
          MAX_STEPS: ${{ inputs.max_steps }}
          RESUME_CHECKPOINT: ${{ inputs.resume_checkpoint }}
          SAVE_STEPS: ${{ inputs.save_steps }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_CHECKPOINT_REPO: Jerlob/vn-stock-ai-p2a-checkpoints
          P2_EVAL_ENABLED: "1"
          P2_TRAIN_APPROVAL_REF: ${{ inputs.training_approval_ref }}
          P2_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          P2_CAMPAIGN_CHAIN_SOURCE_RUN_ID: ${{ inputs.campaign_chain_source_run_id }}
          TRAIN_PROFILE: ${{ inputs.train_profile }}
          EXECUTOR: ${{ inputs.executor }}
          P2_TRAIN_TK4_EMAIL: ${{ vars.P2_TRAIN_TK4_EMAIL }}
          P2_TRAIN_TK5_EMAIL: ${{ vars.P2_TRAIN_TK5_EMAIL }}
          P2_TRAIN_TK1_EMAIL: ${{ vars.P2_TRAIN_TK1_EMAIL }}
          P2_TRAIN_TK6_EMAIL: ${{ vars.P2_TRAIN_TK6_EMAIL }}
          P2_EVAL_TK2_EMAIL: ${{ vars.P2_EVAL_TK2_EMAIL }}
          P2_EVAL_TK5_EMAIL: ${{ vars.P2_EVAL_TK5_EMAIL }}
          DOWNLOAD_REMOTE: ${{ inputs.download_remote || format('/content/p2a-checkpoints/{0}', inputs.mode) }}
          DOWNLOAD_LOCAL: ${{ inputs.download_local || format('p2a-output-{0}.zip', inputs.mode) }}
        run: |
          # Dung venv cai san tren may (deps: google-auth, jupyter-kernel-client...).
          # Neu may moi/chua co venv thi tao moi + cai deps (fallback tu phuc hoi).
          if [ -x "$HOME/vncolab-venv/bin/python" ]; then
            PY="$HOME/vncolab-venv/bin/python"
          else
            python3 -m venv .vncolab-venv
            .vncolab-venv/bin/pip install -q "google-auth>=2.49.1" "google-auth-oauthlib>=1.3.0" "requests>=2.32.5" "jupyter-kernel-client==0.9.0" "nbformat>=5.10.4" "websocket-client>=1.6"
            PY=".vncolab-venv/bin/python"
          fi
          "$PY" -m pip install -q "huggingface_hub==0.30.2" "cryptography>=44,<47"
          if [ "$EXECUTOR" = "lv1" ]; then
            case "$TRAIN_PROFILE" in
              train_tk4|train_tk5|train_tk1|train_tk6) ;;
              *) echo "Unsupported named training profile" >&2; exit 2 ;;
            esac
            export VNCOLAB_HOME="$HOME/.config/vncolab/$TRAIN_PROFILE"
            "$PY" scripts/p2_profile_check.py --kind train --profile "$TRAIN_PROFILE"
          fi
          download_args=()
          if [ -n "$DOWNLOAD_REMOTE" ] && [ -n "$DOWNLOAD_LOCAL" ]; then
            download_args=(--download "$DOWNLOAD_REMOTE" "$DOWNLOAD_LOCAL")
          fi
          # --mode: env cua runner KHONG tu sang kernel Colab (vncolab chi gui
          # source code qua execute_code), nen phai truyen tuong minh; vncolab
          # se set os.environ["MODE"] tren kernel truoc cell dau tien.
          "$PY" scripts/vncolab.py run "${{ inputs.notebook }}" --gpu "${{ inputs.gpu }}" --timeout "${{ inputs.timeout }}" --mode "$MODE" --max-steps "$MAX_STEPS" --resume-checkpoint "$RESUME_CHECKPOINT" --save-steps "$SAVE_STEPS" --out colab_result.json "${download_args[@]}"
      - name: Upload non-secret campaign run context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-campaign-run-context
          path: p2-campaign-run-context.json
          if-no-files-found: error
          retention-days: 30
      - name: Show result
        if: always()
        run: |
          echo "--- COLAB RESULT ---"
          if [ -f colab_result.json ]; then
            cat colab_result.json
          else
            echo "No Colab result was produced because a pre-assignment gate failed."
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-result
          path: colab_result.json
      - name: Stage P2 evaluation results
        if: always()
        run: |
          if [ -d "$HOME/p2-evaluations" ]; then
            mkdir -p p2-evaluations-run
            cp -a "$HOME/p2-evaluations/." p2-evaluations-run/
          fi
      - name: Upload P2 evaluation trend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-evaluations
          path: p2-evaluations-run/
          if-no-files-found: ignore
      - name: Check downloaded adapter
        id: adapter
        if: always()
        env:
          DOWNLOAD_REMOTE: ${{ inputs.download_remote || format('/content/p2a-checkpoints/{0}', inputs.mode) }}
          DOWNLOAD_LOCAL: ${{ inputs.download_local || format('p2a-output-{0}.zip', inputs.mode) }}
        run: |
          if [ -f "$DOWNLOAD_LOCAL" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: colab-adapter
        if: always() && steps.adapter.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p2a-output
          path: ${{ inputs.download_local || format('p2a-output-{0}.zip', inputs.mode) }}
          if-no-files-found: ignore
      - name: Signal P2 coordinator after run completion
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'p2-campaign-run-completed',
              client_payload: { run_id: context.runId }
            })

  p2a-v2-smoke:
    if: ${{ inputs.p2a_v2_smoke && !inputs.drive_inventory && !inputs.hf_source_audit }}
    runs-on: [self-hosted, colab-driver-lv1]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download private v2 labels from the audited source run
        uses: actions/download-artifact@v4
        with:
          name: p2a-vndirect-adclose-audit
          path: /tmp/p2a-v2-smoke-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.p2a_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select real balanced v2 smoke slice
        run: |
          set -euo pipefail
          TRAIN_FILE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/p2a-v2-smoke-source')
          candidates=list(root.rglob('p1_train_v2.jsonl'))
          if len(candidates)!=1:
              raise SystemExit(f'expected one v2 train file, found {len(candidates)}')
          if list(root.rglob('*adclose-endpoints*')) or list(root.rglob('adjusted_prices.csv')):
              raise SystemExit('raw adjusted-price files must not be transferred to Colab')
          manifest=next(candidates[0].parent.glob('p1_train_v2.manifest.json'))
          if json.loads(manifest.read_text())['label_version'] != 2:
              raise SystemExit('smoke input must use label v2')
          print(candidates[0])
          PY
          )"
          python3 scripts/p2a_validation.py --input "$TRAIN_FILE" \
            --output /tmp/p2a_train_v2_smoke.jsonl \
            --manifest /tmp/p2a_train_v2_smoke.manifest.json --per-class 32 --seed 42
          python3 - <<'PY'
          import collections,hashlib,json
          from pathlib import Path
          p=Path('/tmp/p2a_train_v2_smoke.jsonl'); counts=collections.Counter(); versions=set()
          with p.open() as f:
              for line in f:
                  m=json.loads(line)['metadata']; versions.add(m.get('p2a_label_version'))
                  counts[(m.get('label') or {}).get('future_direction_120')]+=1
          if versions!={2} or counts!={'UP':32,'DOWN':32}:
              raise SystemExit(f'invalid smoke slice: versions={versions} counts={counts}')
          print(json.dumps({'rows':sum(counts.values()),'labels':dict(counts),
                            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                            'raw_adjusted_prices_in_slice':False},sort_keys=True))
          PY
      - name: Audit v2 temporal split and data-only baselines
        run: |
          set -euo pipefail
          TRAIN_FILE="$(find /tmp/p2a-v2-smoke-source -type f -name p1_train_v2.jsonl -print -quit)"
          HOLDOUT_FILE="$(find /tmp/p2a-v2-smoke-source -type f -name p1_holdout_v2.jsonl -print -quit)"
          test -n "$TRAIN_FILE" && test -n "$HOLDOUT_FILE"
          python3 scripts/p2a_data_audit.py --input "$TRAIN_FILE" --input "$HOLDOUT_FILE" \
            --output p2a-v2-data-audit.json
          python3 scripts/p2a_baseline_report.py --input "$TRAIN_FILE" --input "$HOLDOUT_FILE" \
            --output p2a-v2-baselines.json
      - name: Refuse overlap with any active Colab training workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/p2a_check_colab_overlap.py
      - name: Prepare Colab client dependencies for TK2 assignment check
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/vncolab-venv/bin/python" ]; then
            python3 -m venv "$HOME/vncolab-venv"
            "$HOME/vncolab-venv/bin/pip" install -q "google-auth>=2.49.1" "google-auth-oauthlib>=1.3.0" "requests>=2.32.5" "jupyter-kernel-client==0.9.0" "nbformat>=5.10.4" "websocket-client>=1.6"
          fi
      - name: Refuse allocation if TK2 already has an active Colab assignment
        env:
          P2_EVAL_TK2_EMAIL: ${{ vars.P2_EVAL_TK2_EMAIL }}
        run: |
          set -euo pipefail
          "$HOME/vncolab-venv/bin/python" scripts/p2a_colab_assignment_check.py --profile tk2
      - name: Run bounded TK2 Colab smoke, TK5 only on assign HTTP 503
        env:
          P2_EVAL_TK2_EMAIL: ${{ vars.P2_EVAL_TK2_EMAIL }}
          P2_EVAL_TK5_EMAIL: ${{ vars.P2_EVAL_TK5_EMAIL }}
        run: |
          set -euo pipefail
          if [ -x "$HOME/vncolab-venv/bin/python" ]; then
            PY="$HOME/vncolab-venv/bin/python"
          else
            python3 -m venv .vncolab-venv
            .vncolab-venv/bin/pip install -q "google-auth>=2.49.1" "google-auth-oauthlib>=1.3.0" "requests>=2.32.5" "jupyter-kernel-client==0.9.0" "nbformat>=5.10.4" "websocket-client>=1.6"
            PY=".vncolab-venv/bin/python"
          fi
          "$PY" scripts/p2a_colab_smoke.py \
            --train /tmp/p2a_train_v2_smoke.jsonl \
            --max-steps "${{ inputs.p2a_smoke_max_steps }}" --timeout 18000 \
            --output p2a-v2-smoke-summary.json
      - name: Upload sanitized v2 validation and smoke summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v2-gradient-smoke-summary
          path: |
            p2a-v2-smoke-summary.json
            p2a-v2-data-audit.json
            p2a-v2-baselines.json
          if-no-files-found: ignore
          retention-days: 7

  p2a-v2-ablation:
    if: ${{ inputs.p2a_v2_ablation && !inputs.drive_inventory && !inputs.hf_source_audit && !inputs.p2a_v2_smoke }}
    runs-on: [self-hosted, colab-driver-lv1]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download private v2 labels from audited source run
        uses: actions/download-artifact@v4
        with:
          name: p2a-vndirect-adclose-audit
          path: /tmp/p2a-v2-ablation-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.p2a_ablation_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create leakage-safe internal train and validation slices
        run: |
          set -euo pipefail
          TRAIN_FILE="$(find /tmp/p2a-v2-ablation-source -type f -name p1_train_v2.jsonl -print -quit)"
          test -n "$TRAIN_FILE"
          if find /tmp/p2a-v2-ablation-source -type f \( -name '*adclose-endpoints*' -o -name 'adjusted_prices.csv' \) | grep -q .; then
            echo "Raw adjusted-price table found in private label artifact path; refusing model transfer."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('/tmp/p2a-v2-ablation-source').rglob('p1_train_v2.jsonl'))
          manifest=next(p.parent.glob('p1_train_v2.manifest.json'))
          if json.loads(manifest.read_text())['label_version'] != 2:
              raise SystemExit('train manifest is not label v2')
          PY
          python3 scripts/p2a_ablation_slices.py --input "$TRAIN_FILE" \
            --output-dir /tmp/p2a-ablation-slices --validation-year 2024 \
            --train-per-class 64 --validation-per-class 32 --seed 42
      - name: Refuse overlap with any active Colab training workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/p2a_check_colab_overlap.py
      - name: Prepare Colab client dependencies for TK2 assignment check
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/vncolab-venv/bin/python" ]; then
            python3 -m venv "$HOME/vncolab-venv"
            "$HOME/vncolab-venv/bin/pip" install -q "google-auth>=2.49.1" "google-auth-oauthlib>=1.3.0" "requests>=2.32.5" "jupyter-kernel-client==0.9.0" "nbformat>=5.10.4" "websocket-client>=1.6"
          fi
      - name: Refuse allocation if TK2 already has an active Colab assignment
        env:
          P2_EVAL_TK2_EMAIL: ${{ vars.P2_EVAL_TK2_EMAIL }}
        run: |
          set -euo pipefail
          "$HOME/vncolab-venv/bin/python" scripts/p2a_colab_assignment_check.py --profile tk2
      - name: Run controlled short v2 ablations on Colab
        env:
          P2_EVAL_TK2_EMAIL: ${{ vars.P2_EVAL_TK2_EMAIL }}
          P2_EVAL_TK5_EMAIL: ${{ vars.P2_EVAL_TK5_EMAIL }}
        run: |
          set -euo pipefail
          "$HOME/vncolab-venv/bin/python" scripts/p2a_colab_ablation.py \
            --train /tmp/p2a-ablation-slices/train-v2.jsonl \
            --validation /tmp/p2a-ablation-slices/validation-v2.jsonl \
            --split-manifest /tmp/p2a-ablation-slices/split-manifest.json \
            --max-steps "${{ inputs.p2a_ablation_steps }}" --timeout 18000 \
            --output-dir p2a-ablation
      - name: Upload sanitized ablation manifests and metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v2-controlled-ablation
          path: p2a-ablation/manifest.json
          if-no-files-found: ignore
          retention-days: 14

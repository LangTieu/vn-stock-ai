name: Prepare and publish private P2a V2 train/validation dataset

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Authorized private Finfo V2-label Actions artifact source run"
        required: true
        default: "43691791091"
      publish_confirmed:
        description: "Confirm Liaison approved publishing derived V2 train/internal-validation JSONL to the new private dataset repo"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prepare-and-publish:
    if: ${{ inputs.publish_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/p2-async-evaluation
      - uses: actions/download-artifact@v4
        with:
          name: p2a-vndirect-adclose-audit
          path: /tmp/p2a-v2-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publishing dependencies
        run: python -m pip install --quiet "huggingface_hub==0.30.2" "cryptography>=44,<47"
      - name: Prepare full leakage-separated V2 train and internal validation
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test "$SOURCE_RUN_ID" = "43691791091" || { echo "Only audited source run 43691791091 is permitted" >&2; exit 2; }
          TRAIN_FILE="$(find /tmp/p2a-v2-source -type f -name p1_train_v2.jsonl -print -quit)"
          test -n "$TRAIN_FILE"
          SOURCE_MANIFEST="$(find /tmp/p2a-v2-source -type f -name p1_train_v2.manifest.json -print -quit)"
          test -n "$SOURCE_MANIFEST"
          export SOURCE_MANIFEST
          if find /tmp/p2a-v2-source -type f \( -name '*adclose-endpoints*' -o -name 'adjusted_prices.csv' \) | grep -q .; then
            echo "Raw adjusted-price data present in source artifact; refusing publication." >&2
            exit 2
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['SOURCE_MANIFEST'])
          m=json.loads(p.read_text())
          if m.get('label_version') != 2 or m.get('method') != 'adjusted_total_return_close; 120 exchange sessions after as_of':
              raise SystemExit('source labels are not the expected V2 method')
          if m.get('flat_band_pct') != 2.0:
              raise SystemExit('source V2 flat band mismatch')
          PY
          python3 scripts/p2a_v2_dataset.py prepare \
            --train "$TRAIN_FILE" --source-manifest "$SOURCE_MANIFEST" \
            --source-run-id "$SOURCE_RUN_ID" --output-dir /tmp/p2a-v2-publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/p2a-v2-publish/v2-dataset-manifest.json').read_text())
          if m.get('raw_adjusted_price_table_included') is not False or m.get('external_holdout_included') is not False:
              raise SystemExit('publication includes forbidden raw price/external holdout data')
          print(json.dumps({'train_sha256':m['files']['train-v2.jsonl']['sha256'],
                            'validation_sha256':m['files']['validation-v2.jsonl']['sha256'],
                            'train_rows':m['files']['train-v2.jsonl']['rows'],
                            'validation_rows':m['files']['validation-v2.jsonl']['rows']}))
          PY
      - name: Publish signed files to the new private Jerlob dataset repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          P2A_V2_DATASET_SIGNING_PRIVATE_KEY_B64: ${{ secrets.P2A_V2_DATASET_SIGNING_PRIVATE_KEY_B64 }}
          P2A_V2_DATASET_SIGNING_PUBLIC_KEY_B64: ${{ vars.P2A_V2_DATASET_SIGNING_PUBLIC_KEY_B64 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN is required" >&2; exit 2; }
          test -n "$P2A_V2_DATASET_SIGNING_PRIVATE_KEY_B64" || { echo "V2 signing key secret is not provisioned" >&2; exit 2; }
          test -n "$P2A_V2_DATASET_SIGNING_PUBLIC_KEY_B64" || { echo "V2 signing public key variable is not provisioned" >&2; exit 2; }
          python3 scripts/p2a_v2_dataset.py publish \
            --prepared-dir /tmp/p2a-v2-publish \
            --source-run-id "$SOURCE_RUN_ID" \
            --repo-id Jerlob/vn-stock-ai-p2a-v2 \
            --output p2a-v2-publication-receipt.json
      - name: Upload revision/hash receipt for Liaison to pin in campaign manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v2-private-dataset-publication-receipt
          path: p2a-v2-publication-receipt.json
          if-no-files-found: ignore
          retention-days: 30

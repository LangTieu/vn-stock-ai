model_list:
- model_name: vn-stock-cerebras
  litellm_params:
    model: openai/gpt-oss-120b
    api_base: https://api.cerebras.ai/v1
    api_key: os.environ/CEREBRAS_API_KEY
    timeout: 60
- model_name: vn-stock-deepseek
  litellm_params:
    model: openai/deepseek-v4.1-flash-free
    api_base: https://direct.beatapi.io/v1
    api_key: os.environ/BEATAPI_API_KEY
    timeout: 60
- model_name: vn-stock-glm
  litellm_params:
    model: openai/glm-5.3-flash-free
    api_base: https://direct.beatapi.io/v1
    api_key: os.environ/BEATAPI_API_KEY
    timeout: 60
- model_name: vn-stock
  litellm_params:
    model: openai/gpt-oss-120b
    api_base: https://api.cerebras.ai/v1
    api_key: os.environ/CEREBRAS_API_KEY
    timeout: 60
- model_name: vn-stock-tuoke-6.1-sol
  litellm_params:
    model: openai/gpt-6.1-sol
    api_base: https://tuokeapi.com/v1
    api_key: os.environ/TUOKE_API_KEY
    timeout: 300
- model_name: vn-stock-tuoke-6-sol
  litellm_params:
    model: openai/gpt-6-sol
    api_base: https://tuokeapi.com/v1
    api_key: os.environ/TUOKE_API_KEY
    timeout: 300
- model_name: vn-stock-itera-qwen
  litellm_params:
    model: openai/qwen/qwen3.8-27b
    api_base: https://api.iteracompute.com/v1
    api_key: os.environ/ITERACOMPUTE_API_KEY
    timeout: 60
router_settings:
  fallbacks:
  - vn-stock:
    - vn-stock-tuoke-6.1-sol
    - vn-stock-tuoke-6-sol
    - vn-stock-cerebras
    - vn-stock-deepseek
    - vn-stock-glm
  - vn-stock-cerebras:
    - vn-stock-deepseek
    - vn-stock-glm
  - vn-stock-deepseek:
    - vn-stock-glm
    - vn-stock-cerebras
  - vn-stock-glm:
    - vn-stock-cerebras
    - vn-stock-deepseek
  - vn-stock-tuoke-6.1-sol:
    - vn-stock-tuoke-6-sol
  - vn-stock-tuoke-6-sol:
    - vn-stock-tuoke-6.1-sol
  - vn-stock-itera-qwen:
    - vn-stock-tuoke-6.1-sol
    - vn-stock-gonka-glm
    - vn-stock-fosta-sol
  num_retries: 0
litellm_settings:
  drop_params: true

# LiteLLM Proxy config — VN Stock AI (chay tren may, port 4001).
# TACH RIENG khoi router coding (port 4000) de khong anh huong Qoder/Perch.
# Chi dung model FREE da co key tren may: Cerebras + BeatAPI.
# (Leg LLM7/Gemini/Radox/Workers AI trong plan can key rieng — chua co
#  tren may; them vao day khi co key, theo mau ben duoi.)
# Key doc tu bien moi truong (start.sh doc tu file 0600) — khong ghi
#  key that vao file nay.
model_list:
  - model_name: vn-stock-cerebras
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 60
  - model_name: vn-stock-deepseek
    litellm_params:
      model: openai/deepseek-v4.1-flash-free
      api_base: https://direct.beatapi.io/v1
      api_key: os.environ/BEATAPI_API_KEY
      timeout: 60
  - model_name: vn-stock-glm
    litellm_params:
      model: openai/glm-5.3-flash-free
      api_base: https://direct.beatapi.io/v1
      api_key: os.environ/BEATAPI_API_KEY
      timeout: 60
  - model_name: vn-stock
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 60

